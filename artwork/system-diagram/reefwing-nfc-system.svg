<text x="1650" y="414" font-size="24" font-weight="700" style="fill:#183049" text-anchor="middle">9 red LEDs</text>
<circle cx="1595" cy="470" r="9" fill="#ed6b56"/>
<circle cx="1595" cy="510" r="9" fill="#ed6b56"/>
<circle cx="1595" cy="550" r="9" fill="#ed6b56"/>
