<polyline points="1380,840 1380,690" fill="none" stroke="#d88715" stroke-width="4" stroke-linejoin="round" marker-end="url(#power)"/>
<text x="1396" y="790" font-size="18" font-weight="700" style="fill:#a66508" text-anchor="start">3 V → VDD rail</text>
<polyline points="50,1030 95,1030" fill="none" stroke="#d88715" stroke-width="4" stroke-linejoin="round"/>
<text x="107" y="1037" font-size="19" font-weight="400" style="fill:#183049" text-anchor="start">Power</text>
<polyline points="235,1030 280,1030" fill="none" stroke="#168ba0" stroke-width="4" stroke-linejoin="round"/>
<text x="292" y="1037" font-size="19" font-weight="400" style="fill:#183049" text-anchor="start">RF / I²C data</text>
<polyline points="485,1030 530,1030" fill="none" stroke="#7754b5" stroke-width="4" stroke-linejoin="round"/>
<text x="542" y="1037" font-size="19" font-weight="400" style="fill:#183049" text-anchor="start">Control / programming</text>
