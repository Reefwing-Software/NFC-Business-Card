<circle cx="1705" cy="535" r="9" fill="#ed6b56"/>
<text x="1650" y="606" font-size="20" font-weight="400" style="fill:#183049" text-anchor="middle">1 kΩ per LED</text>
<text x="1445" y="726" font-size="19" font-weight="700" style="fill:#32906c" text-anchor="start">PA4–PA7 / PB0–PB4</text>
<text x="1517" y="755" font-size="18" font-weight="400" style="fill:#617185" text-anchor="start">One LED on at a time</text>
<rect x="50" y="780" width="910" height="205" rx="18" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="75" y="819" font-size="20" font-weight="700" style="fill:#168ba0" text-anchor="start">TWO OPERATING MODES</text>
<text x="75" y="859" font-size="23" font-weight="700" style="fill:#183049" text-anchor="start">NFC use: JP1 closed; the phone powers the card.</text>
<text x="75" y="891" font-size="21" font-weight="400" style="fill:#183049" text-anchor="start">VOUT typically provides 2 V at 5 mA with an NFC phone.*</text>
<text x="75" y="930" font-size="23" font-weight="700" style="fill:#183049" text-anchor="start">Programming: JP1 open; external 3 V powers both ICs.</text>
<text x="75" y="962" font-size="21" font-weight="400" style="fill:#183049" text-anchor="start">Keep the card away from NFC readers while programming.</text>
<rect x="1090" y="840" width="540" height="145" rx="18" fill="#fff2d9" stroke="#d88715" stroke-width="2"/>
<text x="1115" y="879" font-size="23" font-weight="700" style="fill:#183049" text-anchor="start">J1  /  Three pogo programming pads</text>
<text x="1115" y="917" font-size="22" font-weight="400" style="fill:#183049" text-anchor="start">GND • 3V0 / VDD • UPDI</text>
<text x="1115" y="951" font-size="21" font-weight="400" style="fill:#617185" text-anchor="start">Adafruit UPDI Friend set to 3 V</text>
