<text x="1035" y="552" font-size="21" font-weight="700" style="fill:#7754b5" text-anchor="middle">FD → PA3</text>
<text x="1035" y="618" font-size="17" font-weight="400" style="fill:#183049" text-anchor="middle">Open-drain</text>
<text x="1035" y="642" font-size="17" font-weight="400" style="fill:#183049" text-anchor="middle">100 kΩ pull-up</text>
<rect x="1120" y="340" width="350" height="350" rx="18" fill="#fff" stroke="#7754b5" stroke-width="2"/>
<rect x="1122" y="342" width="346" height="76" rx="16" fill="#ede7f7" stroke="none" stroke-width="2"/>
<text x="1145" y="374" font-size="20" font-weight="700" style="fill:#183049" text-anchor="start">U2  /  Microchip tinyAVR</text>
<text x="1145" y="402" font-size="26" font-weight="700" style="fill:#183049" text-anchor="start">ATtiny816</text>
<text x="1145" y="454" font-size="22" font-weight="700" style="fill:#183049" text-anchor="start">8-bit AVR CPU</text>
<text x="1145" y="482" font-size="18" font-weight="400" style="fill:#617185" text-anchor="start">1 MHz in this project</text>
<text x="1145" y="535" font-size="22" font-weight="700" style="fill:#183049" text-anchor="start">8 KB Flash • 512 B SRAM</text>
<text x="1145" y="563" font-size="18" font-weight="400" style="fill:#617185" text-anchor="start">Animation + URL writer sketches</text>
<text x="1145" y="616" font-size="22" font-weight="700" style="fill:#183049" text-anchor="start">RTC + GPIO + TWI + UPDI</text>
<text x="1145" y="644" font-size="18" font-weight="400" style="fill:#617185" text-anchor="start">Sleeps between animation steps</text>
