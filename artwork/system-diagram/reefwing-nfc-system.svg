<text x="625" y="402" font-size="26" font-weight="700" style="fill:#183049" text-anchor="start">NT3H2111</text>
<text x="625" y="454" font-size="22" font-weight="700" style="fill:#183049" text-anchor="start">RF interface + rectifier</text>
<text x="625" y="482" font-size="19" font-weight="400" style="fill:#617185" text-anchor="start">NFC Forum Type 2 Tag</text>
<text x="625" y="535" font-size="22" font-weight="700" style="fill:#183049" text-anchor="start">EEPROM + NDEF URI</text>
<text x="625" y="563" font-size="19" font-weight="400" style="fill:#617185" text-anchor="start">Stores the website address</text>
<text x="625" y="616" font-size="22" font-weight="700" style="fill:#183049" text-anchor="start">I²C interface + FD output</text>
<text x="625" y="644" font-size="19" font-weight="400" style="fill:#617185" text-anchor="start">Energy harvesting on VOUT</text>
<polyline points="950,468 1120,468" fill="none" stroke="#168ba0" stroke-width="4" stroke-linejoin="round" marker-end="url(#data)" marker-start="url(#data)"/>
