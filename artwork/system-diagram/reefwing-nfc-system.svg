<text x="565" y="451" font-size="16" font-weight="700" style="fill:#183049" text-anchor="middle">LA / LB</text>
<text x="55" y="686" font-size="21" font-weight="700" style="fill:#168ba0" text-anchor="start">13.56 MHz • RF energy + bidirectional NFC data</text>
