<text x="902" y="1037" font-size="19" font-weight="400" style="fill:#183049" text-anchor="start">LED drive</text>
<text x="50" y="1075" font-size="18" font-weight="400" style="fill:#617185" text-anchor="start">*Harvested output depends on field strength, antenna and distance. All blocks share GND; decoupling and bus pull-ups omitted.</text>
<text x="50" y="1103" font-size="17" font-weight="400" style="fill:#617185" text-anchor="start">Sources: NXP NT3H2111/2211 §§6, 8.6; Microchip DS40002288A §§2–5; Reefwing Rev C schematic and firmware.</text>
